name: validate

on:
  push:
    branches: [fix/22.8-revert-stable-core]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile extension
        run: python -m py_compile scripts/ronin_ui.py install.py
      - name: Run behavioral tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
